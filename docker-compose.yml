version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: judge_postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  # Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: judge_redis
    networks:
      - app_network

  # Backend API
  backend:
    build: ./backend
    container_name: backend_api
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - app_network

  # Judge Worker
  judge_worker:
    build: ./judge-worker
    container_name: judge_worker
    env_file: .env
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - app_network

  # Frontend (Optional - nếu muốn containerize)
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"  # Vite dev server
  #   depends_on:
  #     - backend

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: